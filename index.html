.proc h3{margin:0 0 .4em}.proc p{margin:0;line-height:1.7}

/* שאלות */
details.g summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
details.g summary::-webkit-details-marker{display:none}
details.g summary::after{content:'+';flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:1.3rem;background:color-mix(in srgb,var(--a) 18%,transparent);transition:transform .35s var(--ease),background .3s}
details.g[open] summary::after{content:'\2212';transform:rotate(180deg);background:var(--a);color:#04112a}
details.g[open]>:not(summary){animation:fd .4s var(--ease)}
details.g{transition:border-color .3s,box-shadow .3s}details.g:hover{border-color:color-mix(in srgb,var(--a) 50%,transparent)}

/* קריאה לפעולה */
.cta{position:relative;margin:96px 0 20px;padding:clamp(36px,6vw,76px) 22px;text-align:center;overflow:hidden;isolation:isolate}
.cta::before{content:'';position:absolute;inset:-45%;z-index:-1;opacity:.24;filter:blur(64px);background:conic-gradient(from 0deg,var(--a),var(--v),var(--a2),var(--a));animation:spin 20s linear infinite}
.cta h2{margin:0 0 .3em;font-size:clamp(1.9rem,5vw,3.3rem)}.cta p{margin:0 auto 1.6em;max-width:520px}
.cta .b{margin:4px 5px}

/* פוטר */
.ft{position:relative;overflow:hidden;padding-bottom:84px}
.ft>div{position:relative;z-index:1}
.ft>.ftw{position:absolute;z-index:0;left:0;right:0;bottom:-.22em;text-align:center;direction:ltr;pointer-events:none;font:900 clamp(4rem,19vw,15rem)/1 Unbounded,sans-serif;color:transparent;-webkit-text-stroke:1px color-mix(in srgb,var(--a) 24%,transparent)}

/* כפתורים צפים */
.fab{position:fixed;left:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:10px}
.fab .b{width:50px;height:50px;padding:0;margin:0;border-radius:50%;display:grid;place-items:center}
#upbtn{opacity:0;pointer-events:none;transform:translateY(12px)}#upbtn.on{opacity:1;pointer-events:auto;transform:none}
body[data-r=admin] .fab{display:none}

/* מסכי כניסה, טפסים ופרטים */
.c{position:relative;overflow:hidden}
.c .k{position:relative}
.c .k::before{content:'';position:absolute;inset:-1px;z-index:-1;border-radius:inherit;opacity:.5;filter:blur(26px);background:conic-gradient(from 0deg,var(--a),var(--v),var(--a2),var(--a));animation:spin 14s linear infinite}
article.k iframe{box-shadow:0 30px 80px color-mix(in srgb,var(--a) 25%,transparent)}
#dl .b{font-size:1.1rem;padding:15px 38px}
.fbar{padding:14px;margin:16px 0;gap:10px}
.fbar input,.fbar select{margin:0}
.ts{animation:up .45s var(--ease)}
.mod{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fd .25s}

/* ניהול */
.sb{background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.03))}
.sb .b{border-radius:12px;text-align:right}
.sb .b.on{outline:0;color:#fff;border-color:transparent;background:linear-gradient(135deg,color-mix(in srgb,var(--a) 75%,#0369a1),var(--v));box-shadow:0 8px 24px color-mix(in srgb,var(--a) 35%,transparent)}
.st .g{transition:transform .3s var(--ease),box-shadow .3s,border-color .3s;position:relative;overflow:hidden}
.st .g:hover{transform:translateY(-4px);border-color:var(--a);box-shadow:0 18px 40px color-mix(in srgb,var(--a) 25%,transparent)}
.st b{font:900 2.2rem Unbounded,Rubik,sans-serif;direction:ltr;background:linear-gradient(180deg,#fff,var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
tr:hover td{background:rgba(255,255,255,.05)}th{font-weight:600;opacity:.7}
#sv{border:1px solid var(--gb)}
@media(max-width:820px){.fab{bottom:78px}}
@media(prefers-reduced-motion:reduce){.hero-t::before,.hero-t::after{display:none}}
